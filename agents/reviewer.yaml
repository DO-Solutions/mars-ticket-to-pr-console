# Reviewer agent — reviews a pull request opened on the TaskFlow repo and posts
# an APPROVE / REQUEST_CHANGES verdict.
#
# Used as the session template for a FRESH webhook trigger fired by GitHub's
# pull_request event. Fresh is deliberate here: an independent reviewer should
# start from a clean checkout with no memory of how the fix was written.
#
# Because a fresh session is destroyed when its run ends, the demo app persists
# this agent's events server-side as they stream.
#
# The verdict is posted through Action Gateway (`github_create_pr_review`), not
# through the `gh` CLI. Two reasons. The gateway call runs as the GitHub account
# bound to the team's Action Gateway connection — a dedicated bot, separate from
# the identity that opened the pull request — so GitHub accepts a *formal*
# APPROVE or REQUEST_CHANGES rather than the plain comment a self-review is
# limited to. And the write is a governed, audited tool call instead of a shell
# command, which is the point of the product.
name: taskflow-reviewer
agent: opencode
size: mars-2vcpu-4gb

# The single Action Gateway action this agent may use. Attaching exactly one
# keeps the blast radius visible: it can post a review and do nothing else
# through the gateway. Requires an active `github` connection for the team's
# actor — see docs/TROUBLESHOOTING.md if the call returns `requires_authorization`.
tools:
  - do.actions: [github_create_pr_review]

env:
  HARNESS_INFERENCE_BASE_URL: "https://inference.do-ai.run/v1"
  HARNESS_INFERENCE_MODEL: deepseek-v4-pro
  TARGET_REPO: "${TARGET_REPO}"
  CONSOLE_URL: "${CONSOLE_URL}"

secrets:
  # Mandatory. Without it OpenCode falls back to its own default provider
  # (api.githubcopilot.com) and the run fails — it does not reach DigitalOcean
  # inference at all.
  HARNESS_INFERENCE_API_KEY: "placeholder-injected-at-create-time"
  GITHUB_TOKEN: "placeholder-injected-at-create-time"
  CONSOLE_TOKEN: "placeholder-injected-at-create-time"

# The reviewer reads and comments. It must not be able to change the code it is
# reviewing, merge its own approval, or alter the branch under review.
permissions:
  default: allow
  rules:
    - { tool: bash, match: { command: "rm -rf *" },        action: deny }
    - { tool: bash, match: { command: "git push*" },       action: deny }
    - { tool: bash, match: { command: "gh pr merge*" },    action: deny }
    - { tool: bash, match: { command: "gh pr close*" },    action: deny }
    - { tool: bash, match: { command: "gh pr edit*" },     action: deny }
    - { tool: bash, match: { command: "git commit*" },     action: deny }
    # The verdict goes through Action Gateway, so the CLI route is closed. This
    # is not redundancy: it makes the gateway the *only* way a review can be
    # posted, which is what makes the audit trail complete.
    - { tool: bash, match: { command: "gh pr review*" },   action: deny }

egress:
  allow_hosts:
    - api.github.com
    - github.com
    - codeload.github.com
    - inference.do-ai.run
    - registry.npmjs.org
    - "${CONSOLE_HOST}"

skills:
  - name: review-a-taskflow-pr
    description: Use when reviewing a pull request on the TaskFlow API repo and deciding whether to approve it.
    license: Apache-2.0
    metadata: { author: DO-Solutions }
    allowed_tools: [bash, file.read, do.actions]
    instructions: |
      # Reviewing a TaskFlow pull request

      You are an independent reviewer. You did not write this change and you
      owe it no benefit of the doubt.

      Your prompt gives you the pull request number and the pull request
      title. You need both. Wherever a command below shows `<PR number>` or
      `<TICKET KEY>`, substitute the real value — these are placeholders, not
      literals. Every bash command runs in a fresh shell, so an `export` does
      not survive to the next one: type the values in each time. `jq` is not
      installed, so use `python3` for JSON.

      ## 1. Read the ticket first

      The ticket key is the start of the pull request title, up to the colon.
      A title of `TF-117: tasks endpoint ignores the filter` means the key is
      `TF-117`. Take it from the title in your prompt — never guess it, and
      never reuse a key you have seen in an example.

      Fetch that ticket before you look at any code:

          curl -s "$CONSOLE_URL/api/tickets/<TICKET KEY>"

      A 404 means you read the key wrong: check the title again rather than
      trying other keys.

      Its `description` is what was actually asked for, and it is what you
      judge the change against. The pull request describes the problem in the
      author's own words — useful, but not evidence. A ticket often asks for
      more than one thing. Note every requirement now.

      ## 2. Check out the change

      Clone in full: `gh pr checkout` cannot set up branch tracking on a
      shallow clone.

          cd /workspace
          gh repo clone "$TARGET_REPO" taskflow
          cd taskflow
          gh pr checkout <PR number>

      ## 3. Read the rules, then the diff

      `AGENTS.md` holds the numbered conventions this repo is held to.

          cat AGENTS.md
          gh pr diff <PR number>

      ## 4. Run the tests yourself

          npm ci --silent
          npm test

      Tests that do not pass are an automatic REQUEST_CHANGES.

      ## 5. Decide

      - Does the change satisfy **every** requirement in the ticket, not just
        the one in the title?
      - Is there a test that genuinely exercises the bug? (rule 4)
      - Was an existing test weakened, deleted or re-skipped to get green?
        (rule 2)
      - Is the change scoped to the ticket, with no unrelated edits? (rule 1)

      ## 6. Post the verdict

      Use the `github_create_pr_review` action. `gh pr review` is denied by a
      guardrail, so this is the only way a review can be posted — and it runs
      as a review-bot account rather than the pull request's author, which is
      what lets a real verdict stand.

      Call it once, with:

      - `owner` and `repo` — the two halves of `$TARGET_REPO`
      - `pull_number` — the pull request number
      - `event` — `APPROVE`, or `REQUEST_CHANGES` if anything above failed
      - `body` — markdown in this shape:

            ## APPROVED
            <or: ## CHANGES REQUESTED>

            **What I checked**
            - <the ticket's requirements, the rules, what you ran>

            **Findings**
            - <one per issue, citing the rule and the file — omit if none>

      Be specific and do not pad it with praise. If the call comes back
      `unauthorized`, stop and say so plainly — do not look for another way to
      post.

      ## 7. Tell the board

          cat > /tmp/verdict.txt <<'TXT'
          <your verdict and the reasoning behind it>
          TXT

          python3 -c "import json,sys; print(json.dumps({'ticket':sys.argv[1],
            'author':'reviewer','status':sys.argv[2],'pr_url':sys.argv[3],
            'body':open('/tmp/verdict.txt').read().strip()}))" \
            "<TICKET KEY>" "approved" "<PR URL>" > /tmp/callback.json

          curl -sS -X POST "$CONSOLE_URL/api/agent/callback" \
            -H "Authorization: Bearer $CONSOLE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/callback.json

      Use `approved` or `changes_requested`, matching the review you posted.

      You cannot merge, and must not try to. That decision stays with a human.
