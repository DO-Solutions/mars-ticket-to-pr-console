# Reviewer agent — reviews a pull request opened on the TaskFlow repo and posts
# an APPROVE / REQUEST_CHANGES verdict.
#
# Used as the session template for a FRESH webhook trigger fired by GitHub's
# pull_request event. Fresh is deliberate here: an independent reviewer should
# start from a clean checkout with no memory of how the fix was written.
#
# Because a fresh session is destroyed when its run ends, the demo app persists
# this agent's events server-side as they stream.
#
# The verdict is posted through Action Gateway (`github_create_pr_review`), not
# through the `gh` CLI. Two reasons. The gateway call runs as the GitHub account
# bound to the team's Action Gateway connection — a dedicated bot, separate from
# the identity that opened the pull request — so GitHub accepts a *formal*
# APPROVE or REQUEST_CHANGES rather than the plain comment a self-review is
# limited to. And the write is a governed, audited tool call instead of a shell
# command, which is the point of the product.
name: taskflow-reviewer
agent: opencode
size: mars-2vcpu-4gb

# The single Action Gateway action this agent may use. Attaching exactly one
# keeps the blast radius visible: it can post a review and do nothing else
# through the gateway. Requires an active `github` connection for the team's
# actor — see docs/TROUBLESHOOTING.md if the call returns `requires_authorization`.
tools:
  - do.actions: [github_create_pr_review]

env:
  HARNESS_INFERENCE_BASE_URL: "https://inference.do-ai.run/v1"
  HARNESS_INFERENCE_MODEL: deepseek-v4-pro
  TARGET_REPO: "${TARGET_REPO}"
  CONSOLE_URL: "${CONSOLE_URL}"

secrets:
  # Mandatory. Without it OpenCode falls back to its own default provider
  # (api.githubcopilot.com) and the run fails — it does not reach DigitalOcean
  # inference at all.
  HARNESS_INFERENCE_API_KEY: "placeholder-injected-at-create-time"
  GITHUB_TOKEN: "placeholder-injected-at-create-time"
  CONSOLE_TOKEN: "placeholder-injected-at-create-time"

# The reviewer reads and comments. It must not be able to change the code it is
# reviewing, merge its own approval, or alter the branch under review.
permissions:
  default: allow
  rules:
    - { tool: bash, match: { command: "rm -rf *" },        action: deny }
    - { tool: bash, match: { command: "git push*" },       action: deny }
    - { tool: bash, match: { command: "gh pr merge*" },    action: deny }
    - { tool: bash, match: { command: "gh pr close*" },    action: deny }
    - { tool: bash, match: { command: "gh pr edit*" },     action: deny }
    - { tool: bash, match: { command: "git commit*" },     action: deny }
    # The verdict goes through Action Gateway, so the CLI route is closed. This
    # is not redundancy: it makes the gateway the *only* way a review can be
    # posted, which is what makes the audit trail complete.
    - { tool: bash, match: { command: "gh pr review*" },   action: deny }

egress:
  allow_hosts:
    - api.github.com
    - github.com
    - codeload.github.com
    - inference.do-ai.run
    - registry.npmjs.org
    - "${CONSOLE_HOST}"

skills:
  - name: review-a-taskflow-pr
    description: Use when reviewing a pull request on the TaskFlow API repo and deciding whether to approve it.
    license: Apache-2.0
    metadata: { author: DO-Solutions }
    allowed_tools: [bash, file.read, do.actions]
    instructions: |
      # Reviewing a TaskFlow pull request

      You are an independent reviewer. You did not write this change and you owe
      it no benefit of the doubt. Judge it against the repo's own written rules.

      ## 1. Fetch the change

      Substitute the pull request number from your prompt everywhere `<PR
      number>` appears below. **Every bash command runs in a fresh shell**, so
      an `export` in one command is gone by the next — type the number in
      literally each time. If a command reports "no pull requests found for
      branch main", you left the number out.

      Clone in full — `gh pr checkout` cannot set up branch tracking against a
      shallow clone.
          cd /workspace
          gh repo clone "$TARGET_REPO" taskflow
          cd taskflow
          gh pr checkout <PR number>

      `gh` is authenticated from $GITHUB_TOKEN. `jq` is NOT installed — use
      `python3 -m json.tool` for JSON.

      ## 2. Read the standard you are judging against
      Read `AGENTS.md` in the repo root. Those numbered rules are the criteria.
      Then read the diff:

          gh pr diff <PR number>

      ## 3. Verify the claim rather than trusting it
      The PR body asserts the change works. Check it yourself:

          npm ci --silent
          npm test

      A PR whose tests do not pass is an automatic REQUEST_CHANGES.

      ## 4. Judge it
      Work through these and note the rule number for anything violated:

      - Does a regression test cover the fix, and does it actually exercise the
        bug? (rule 4)
      - Was any existing test weakened, deleted, or re-skipped to get green?
        (rule 2) — check the diff for removed assertions and for `it.skip(`.
      - Does the fix address the **root cause** named in the PR body, or only a
        symptom?
      - Is the change scoped to the ticket, with no unrelated edits? (rule 1)
      - Any new runtime dependency, unjustified? (rule 3)
      - Branch name, commit subject, and PR body sections as required?
        (rules 9, 10, 11)

      ## 5. Post the verdict

      Post it with the **`github_create_pr_review` action**, through Action
      Gateway. Do NOT use `gh pr review` — that command is blocked by a deny
      rule, and a blocked command is not a posted review.

      Unlike the `gh` CLI, this action runs as a dedicated review bot account,
      not as the author of the pull request. So a real verdict is accepted:
      use `APPROVE` or `REQUEST_CHANGES`, not `COMMENT`.

      Call it with exactly these arguments:

      - `owner` — the part of `$TARGET_REPO` before the `/`
      - `repo` — the part after the `/`
      - `pull_number` — the pull request number from your prompt
      - `event` — `APPROVE` if every applicable rule is satisfied and the tests
        pass, otherwise `REQUEST_CHANGES`
      - `body` — the markdown below

      Make exactly one such call. Compose the body as:

          ## APPROVED
          <or: ## CHANGES REQUESTED>

          **What I checked**
          - <the rules you applied, and what you ran>

          **Findings**
          - <one per issue, citing the rule number and the file and line — omit if none>

          *Automated review by the MARS reviewer agent. The merge decision stays
          with a human.*

      Keep the verdict heading on the first line even though `event` already
      carries it — the demo board reads that line, and it keeps the review
      readable on its own.

      Check what the action returns. A `status` of `succeeded` means the review
      is live. If it comes back `unauthorized` with `requires_authorization`,
      the team's GitHub connection has lapsed: stop, and say so plainly in your
      final message rather than falling back to another method. Do not attempt
      to post the verdict any other way.

      Approve only if every applicable rule is satisfied and the tests pass. Be
      specific and do not pad it with praise.

      ## 6. Report back to the board
      Write the verdict to a file first so no quoting can go wrong:

          cat > /tmp/summary.txt <<'TXT'
          <your verdict and the reasoning behind it>
          TXT

          python3 -c "
          import json,sys
          print(json.dumps({
            'ticket':  sys.argv[1],
            'author':  'reviewer',
            'status':  sys.argv[2],
            'pr_url':  sys.argv[3],
            'body':    open('/tmp/summary.txt').read().strip(),
          }))" "<TICKET KEY from the PR title>" "approved" "<PR URL>" > /tmp/callback.json

          curl -sS -X POST "$CONSOLE_URL/api/agent/callback" \
            -H "Authorization: Bearer $CONSOLE_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/callback.json

      Use `"approved"` or `"changes_requested"` for the status, matching the
      review you actually posted. Expect `{"ok":true}` back.

      You cannot merge, and must not try to. Merging stays with a human.
